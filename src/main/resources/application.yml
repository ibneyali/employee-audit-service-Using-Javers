spring:
  application:
    name: audit-service(Javers)

# H2 Database Configuration (fully compatible with JaVers)
  datasource:
    url: jdbc:h2:mem:auditdb;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# Spring SQL initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Disable JaVers auto-configuration (we use manual config)
  autoconfigure:
    exclude:
      - org.javers.spring.boot.sql.JaversSqlAutoConfiguration

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Server Configuration
server:
  port: 8080

# JaVers Configuration
javers:
  auditableAspectEnabled: true
  springDataAuditableRepositoryAspectEnabled: false
  prettyPrint: true
  typeSafeValues: false
  sqlSchema: PUBLIC
  newObjectSnapshot: true
  packagesToScan: com.audit_service.model

